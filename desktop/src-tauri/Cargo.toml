[package]
name = "mcutool-desktop"
version = "0.5.2"
description = "MCU TOOL Windows 桌面工作台"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
strip = true
lto = "thin"
