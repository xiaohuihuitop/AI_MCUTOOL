[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mcutool"
version = "1.1.1"
description = "MCU 开发辅助工具共享后台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pyserial>=3.5,<4", "pydantic>=2.10,<3", "fastmcp>=2.10,<3",
  "esptool==5.2.0", "cryptography>=43", "packaging>=24",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mcutool = "mcutool.cli:main"
mcutool-mcp = "mcutool.mcp:main"

[tool.setuptools.packages.find]
where = ["host"]

[tool.setuptools.package-data]
mcutool = ["firmware-signing.pub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host", "."]
