name: Verify published desktop upgrade
on:
  workflow_dispatch:
    inputs:
      previous:
        description: 已发布的旧桌面版本号
        required: true
        type: string
      draft:
        description: 使用当前提交的草稿安装器验证 MCP 占用和复制期间重连
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  draft_installer:
    if: ${{ inputs.draft && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # AI:GitHub 要求推送权限才能列出草稿。此作业只下载并核对包，不检出或执行仓库代码。
      - name: 读取主线发布描述和同一草稿的安装器
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo/contents/integrations/desktop-release.json?ref=$GITHUB_SHA" --jq .content | base64 -d > descriptor.json
          tag=$(jq -er '.tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' descriptor.json)
          name="MCUTOOL-${tag#v}-windows-x64-setup.exe"
          id=$(gh api --paginate --slurp "$repo/releases?per_page=100" |
            jq -er --arg tag "$tag" --arg name "$name" '[.[][] | select(.draft and .tag_name == $tag) | .assets[] | select(.state == "uploaded" and .name == $name)] | select(length == 1) | first.id')
          gh api "$repo/releases/assets/$id" -H 'Accept: application/octet-stream' > candidate.exe
          printf '%s  candidate.exe\n' "$(jq -er .sha256 descriptor.json)" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: candidate.exe
          retention-days: 1
          compression-level: 0
  upgrade:
    needs: draft_installer
    if: ${{ !cancelled() && (!inputs.draft || needs.draft_installer.result == 'success') }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 安装并核对上一正式版
        shell: pwsh
        env:
          PREVIOUS: ${{ inputs.previous }}
        run: |
          if ($env:PREVIOUS -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw '旧版本号无效' }
          $repo = 'xiaohuihuitop/AI_MCUTOOL'
          $tag = 'v' + $env:PREVIOUS
          $name = "MCUTOOL-$env:PREVIOUS-windows-x64-setup.exe"
          $desc = Invoke-RestMethod "https://raw.githubusercontent.com/$repo/$tag/integrations/desktop-release.json"
          if ($desc.tag -cne $tag -or $desc.installer -cne $name -or $desc.repository -cne $repo) { throw '旧版描述不符' }
          $file = Join-Path $env:RUNNER_TEMP $name
          curl.exe -fLsS --retry 2 "https://github.com/$repo/releases/download/$tag/$name" -o $file
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $file).Hash -ne $desc.sha256) { throw '旧版安装器摘要不符' }
          $installer = Start-Process -FilePath $file -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "旧版安装失败 $($installer.ExitCode)" }
      - name: 从旧工作台安装公开更新并回读版本
        if: ${{ !inputs.draft }}
        shell: pwsh
        env:
          PREVIOUS: ${{ inputs.previous }}
        run: |
          npm.cmd ci --prefix web --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/desktop/published-upgrade.mjs
      - uses: actions/download-artifact@v4
        if: ${{ inputs.draft }}
        with:
          name: desktop-installer
          path: ${{ runner.temp }}/candidate
      - name: 实测草稿安装器释放桥接进程和恢复服务入口
        if: ${{ inputs.draft }}
        shell: pwsh
        run: |
          $desc = Get-Content -Raw integrations/desktop-release.json | ConvertFrom-Json
          $file = Join-Path $env:RUNNER_TEMP 'candidate/candidate.exe'
          if ((Get-FileHash $file).Hash -ne $desc.sha256) { throw '安装器摘要不符' }
          & ./tests/desktop/installer-handoff.ps1 -Installer $file -Version $desc.version
